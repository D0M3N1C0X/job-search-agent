name: Bug report
description: Something behaves differently from what it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please redact your own contact details from any pasted output.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what came back.
      placeholder: |
        $ jsa run
        ...
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version and Python
      description: Output of `jsa --version` and `python3 -V`.
      placeholder: job-search-agent 1.0.0 / Python 3.12.4
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Sources (fetching jobs)
        - Scoring
        - Documents (CV / cover letter)
        - Dashboard or server
        - Install / command line
        - Something else
    validations: { required: true }

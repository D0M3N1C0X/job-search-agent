name: A posting scored wrongly
description: A role that should have passed was rejected, or the reverse.
labels: [scoring]
body:
  - type: markdown
    attributes:
      value: |
        Scoring is rules and configuration, so this is fixable. The breakdown
        from `jsa show <id>` says which dimension is responsible.
  - type: dropdown
    id: direction
    attributes:
      label: Which way
      options:
        - Should have passed, but was rejected or scored low
        - Should have been rejected, but scored high
    validations: { required: true }
  - type: textarea
    id: breakdown
    attributes:
      label: Output of `jsa show <id>`
      render: text
    validations: { required: true }
  - type: textarea
    id: posting
    attributes:
      label: The posting title, and the part of the text that matters
    validations: { required: true }

# Optional. The project runs straight from a clone with `python3 -m jsa`; this
# is for `pipx install git+https://github.com/D0M3N1C0X/job-search-agent` (or
# `pip install .`), which puts a `jsa` command on PATH and keeps the workspace
# in ~/.jsa instead of ./profile. There are no runtime dependencies, and there
# never will be.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-agent"
version = "1.0.0"
description = "A job search that runs as a pipeline: public ATS board APIs, deterministic explainable fit scoring, tailored .docx documents, funnel analytics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Domenico Perroni" }]
keywords = ["job-search", "ats", "people-analytics", "hr", "greenhouse", "lever", "ashby"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/D0M3N1C0X/job-search-agent"
Issues = "https://github.com/D0M3N1C0X/job-search-agent/issues"

[project.scripts]
jsa = "jsa.__main__:main"

[tool.setuptools]
packages = ["jsa", "jsa.sources", "jsa.example"]

# The synthetic example profile ships inside the package as jsa/example/, so an
# installed copy can run the demo and seed a new workspace. In a clone it stays
# where people look for it, at the top of the repository.
[tool.setuptools.package-dir]
"jsa.example" = "profile.example"

[tool.setuptools.package-data]
"jsa.example" = ["*.json"]

# Lint runs in CI only (`ruff check .`); nothing here is needed to run the tool.
# The rules are the ones that find bugs rather than argue about style: pyflakes,
# bugbear, bare excepts, and the security checks that matter for code that
# parses other people's data.
[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F", "B", "BLE", "S"]
ignore = [
  "S603",  # subprocess without a shell is the safe form; every call passes a list
  "S607",  # osascript, launchctl, notify-send: resolved from PATH on purpose
  "S311",  # random only picks synthetic demo data
  "B905",  # both zip() calls truncate on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S310"]

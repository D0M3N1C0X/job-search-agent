# Optional. The project runs straight from a clone with `python3 -m jsa`;
# this exists only so `pip install -e .` or `pipx install .` can put a `jsa`
# command on PATH for people who prefer that route. There are no runtime
# dependencies, and there never will be.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-agent"
version = "1.0.0"
description = "A job search that runs as a pipeline: public ATS board APIs, deterministic explainable fit scoring, tailored .docx documents, funnel analytics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Domenico Perroni" }]
keywords = ["job-search", "ats", "people-analytics", "hr", "greenhouse", "lever", "ashby"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/D0M3N1C0X/job-search-agent"
Issues = "https://github.com/D0M3N1C0X/job-search-agent/issues"

[project.scripts]
jsa = "jsa.__main__:main"

[tool.setuptools]
packages = ["jsa", "jsa.sources"]
